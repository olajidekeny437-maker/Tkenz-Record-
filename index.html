<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tkenz Record | Official</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #080808;
    color: white;
    line-height: 1.6;
}

header {
    min-height: 90vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
    background:
        linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.9)),
        radial-gradient(circle at center, #333, #080808 70%);
}

.hero {
    max-width: 800px;
}

.logo {
    font-size: 18px;
    letter-spacing: 5px;
    text-transform: uppercase;
    margin-bottom: 30px;
    color: #f5c542;
}

h1 {
    font-size: clamp(48px, 12vw, 100px);
    letter-spacing: 3px;
    margin-bottom: 15px;
}

.hero p {
    color: #ccc;
    font-size: 18px;
    margin-bottom: 30px;
}

.button {
    display: inline-block;
    padding: 14px 28px;
    background: #f5c542;
    color: #000;
    text-decoration: none;
    border-radius: 30px;
    font-weight: bold;
    margin: 8px;
    transition: .3s;
}

.button:hover {
    transform: translateY(-3px);
}

section {
    padding: 70px 20px;
    max-width: 1000px;
    margin: auto;
}

section h2 {
    text-align: center;
    font-size: 36px;
    margin-bottom: 40px;
}

.music-card {
    background: #151515;
    border: 1px solid #292929;
    border-radius: 18px;
    padding: 30px;
    text-align: center;
    max-width: 550px;
    margin: auto;
}

.music-card h3 {
    font-size: 30px;
    margin-bottom: 8px;
}

.music-card p {
    color: #aaa;
    margin-bottom: 20px;
}

.contact {
    text-align: center;
    background: #101010;
    max-width: none;
}

.contact p {
    color: #bbb;
    margin: 10px 0;
}

footer {
    text-align: center;
    padding: 30px 20px;
    background: #050505;
    color: #777;
    font-size: 14px;
}

@media (max-width: 600px) {
    header {
        min-height: 80vh;
    }

    section {
        padding: 55px 18px;
    }

    section h2 {
        font-size: 30px;
    }
}
</style>
</head>

<body>

<header>
    <div class="hero">
        <div class="logo">Tkenz Record</div>

        <h1>Tkenz Record</h1>

        <p>
            Official home of Tkenz — music, releases and everything Tkenz.
        </p>

        <a class="button" href="#music">Explore Music</a>
        <a class="button" href="#contact">Contact Us</a>
    </div>
</header>

<section id="music">
    <h2>Featured Music</h2>

    <div class="music-card">
        <h3>You Luv</h3>

        <p>
            Latest release from Tkenz.
        </p>

        <a
            class="button"
            href="https://ffm.to/your-luv-l7ef"
            target="_blank"
            rel="noopener noreferrer"
        >
            Listen Now 🎵
        </a>
    </div>
</section>

<section id="contact" class="contact">
    <h2>Contact Us</h2>

    <p>For music, bookings and business enquiries</p>

    <p>
        <strong>Tkenz Record</strong>
    </p>
</section>

<footer>
    © 2026 Tkenz Record. All rights reserved.
</footer>

</body>
</html>
